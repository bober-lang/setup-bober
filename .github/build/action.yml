name: build
description: Compiles the action into dist/ by the edge bober.
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        curl -sSfL "https://github.com/bober-lang/bober/releases/download/edge/bober-$RUNNER_OS-$RUNNER_ARCH.tar.gz" \
          | tar xz -C "$RUNNER_TEMP"
        npm ci --no-audit --no-fund
        PATH="$RUNNER_TEMP/bober/bin:$PATH" ./build.sh
